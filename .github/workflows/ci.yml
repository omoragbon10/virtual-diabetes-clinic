name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - run: pip install -r requirements.txt flake8
    - run: flake8 app/ src/ --ignore=E501
    - run: python src/train.py --version v0.1
    - uses: actions/upload-artifact@v4
      with:
        name: model-artifacts
        path: |
          model.joblib
          metrics.json
