name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - run: pip install -r requirements.txt
    - run: python src/train.py --version ${{ github.ref_name }}
    - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_NAME="ghcr.io/$REPO_LOWER"
        docker build --build-arg MODEL_VERSION=${{ github.ref_name }} -t $IMAGE_NAME:${{ github.ref_name }} .
        docker run -d -p 80:80 --name test-container $IMAGE_NAME:${{ github.ref_name }}
        sleep 5
        curl -f http://localhost:80/health
        docker stop test-container
        docker push $IMAGE_NAME:${{ github.ref_name }}
    - uses: softprops/action-gh-release@v2
      with:
        files: metrics.json
